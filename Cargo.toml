[package]
name = "the-archive"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.14"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["io", "rt"] }
png = "0.18"
image-webp = "0.2"
zune-jpeg = "0.5"
zune-core = "0.5"
libc = "0.2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
http-body-util = "0.1"
futures-core = "0.3"
serde_json = "1"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.dev]
debug = 0
