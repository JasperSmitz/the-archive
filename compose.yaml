services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive_local
      POSTGRES_DB: archive
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - archive_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  archive_data:
