<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · The Archive</title><link rel="stylesheet" href="/static/app.css"></head><body><main><h1>The Archive</h1><p>Sign in to your private character and artwork archive.</p>
{% if !error.is_empty() %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login"><label>Username<input name="username" value="{{ username }}" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button>Sign in</button></form><p>Accounts are provisioned by the archive owner. There is no public registration or email password reset.</p></main></body></html>
